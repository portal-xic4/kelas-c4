<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal XI-C4</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .login-card { background: #ffffff; width: 100%; max-width: 420px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    .tab-buttons { display: flex; margin-bottom: 20px; background: #eef2f7; border-radius: 8px; padding: 4px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: none; border-radius: 6px; font-weight: 600; cursor: pointer; color: #555; transition: 0.3s; }
    .tab-btn.active { background: #4f46e5; color: #fff; }
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; }
    .btn-submit { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: #4338ca; }
    .toggle-link { margin-top: 15px; font-size: 0.85rem; color: #4f46e5; cursor: pointer; display: block; text-decoration: underline; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Portal Kelas XI-C4</h2>
  <p style="font-size: 0.85rem; color: #666; margin-bottom: 20px;">Silakan masuk sesuai dengan hak akses Anda</p>

  <div class="tab-buttons">
    <button type="button" id="tab-btn-anggota" class="tab-btn active">Anggota Siswa</button>
    <button type="button" id="tab-btn-pengurus" class="tab-btn">Pengurus Kelas</button>
  </div>

  <div id="form-pengurus" class="hidden">
    <div class="form-group">
      <label>Email Pengurus</label>
      <input type="email" id="p-email" placeholder="email pengurus kelas">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="p-password" placeholder="••••••••">
    </div>
    <button type="button" id="btn-login-pengurus" class="btn-submit">Masuk Pengurus</button>
  </div>

  <div id="form-anggota-login">
    <div class="form-group">
      <label>Nomor Induk Siswa</label>
      <input type="text" id="a-noinduk" placeholder="Masukkan Nomor Induk">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="a-password" placeholder="••••••••">
    </div>
    <button type="button" id="btn-login-anggota" class="btn-submit">Masuk Siswa</button>
    <span class="toggle-link" id="link-ke-daftar">Belum punya akun/password? Daftar di sini</span>
  </div>

  <div id="form-anggota-daftar" class="hidden">
    <div class="form-group">
      <label>Nomor Induk Siswa</label>
      <input type="text" id="reg-noinduk" placeholder="Nomor Induk">
    </div>
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="reg-nama" placeholder="Nama Lengkap Kamu">
    </div>
    <div class="form-group">
      <label>Buat Password Baru</label>
      <input type="password" id="reg-password" placeholder="Buat Password">
    </div>
    <button type="button" id="btn-daftar-anggota" class="btn-submit" style="background:#10b981;">Buat Akun & Login</button>
    <span class="toggle-link" id="link-ke-login">Sudah punya akun? Kembali ke Login</span>
  </div>
</div>

<script type="module">
  import { db } from "./firebase-config.js";
  import { collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  // ELEMENTS
  const tabAnggota = document.getElementById('tab-btn-anggota');
  const tabPengurus = document.getElementById('tab-btn-pengurus');
  const formPengurus = document.getElementById('form-pengurus');
  const formAnggotaLogin = document.getElementById('form-anggota-login');
  const formAnggotaDaftar = document.getElementById('form-anggota-daftar');
  const linkKeDaftar = document.getElementById('link-ke-daftar');
  const linkKeLogin = document.getElementById('link-ke-login');

  // TAB SWITCHING
  tabPengurus.addEventListener('click', () => {
    tabPengurus.classList.add('active');
    tabAnggota.classList.remove('active');
    formPengurus.classList.remove('hidden');
    formAnggotaLogin.classList.add('hidden');
    formAnggotaDaftar.classList.add('hidden');
  });

  tabAnggota.addEventListener('click', () => {
    tabAnggota.classList.add('active');
    tabPengurus.classList.remove('active');
    formPengurus.classList.add('hidden');
    formAnggotaLogin.classList.remove('hidden');
    formAnggotaDaftar.classList.add('hidden');
  });

  linkKeDaftar.addEventListener('click', () => {
    formAnggotaLogin.classList.add('hidden');
    formAnggotaDaftar.classList.remove('hidden');
  });

  linkKeLogin.addEventListener('click', () => {
    formAnggotaDaftar.classList.add('hidden');
    formAnggotaLogin.classList.remove('hidden');
  });

  // 1. LOGIN PENGURUS
  document.getElementById('btn-login-pengurus').addEventListener('click', () => {
    const email = document.getElementById("p-email").value.trim();
    const pw = document.getElementById("p-password").value.trim();

    if (email === "penguruskelasc4@gmail.com" && pw === "PengurusC4") {
      localStorage.setItem("userLoggedIn", email);
      localStorage.setItem("userRole", "pengurus");
      localStorage.setItem("userName", "Pengurus Kelas");
      alert("Login Pengurus Berhasil!");
      window.location.href = "kas.html";
    } else {
      alert("Email atau Password Pengurus Salah!");
    }
  });

  // 2. DAFTAR ANGGOTA BARU
  document.getElementById('btn-daftar-anggota').addEventListener('click', async () => {
    const noInduk = document.getElementById("reg-noinduk").value.trim();
    const nama = document.getElementById("reg-nama").value.trim();
    const password = document.getElementById("reg-password").value.trim();

    if (!noInduk || !nama || !password) {
      alert("Harap isi semua kolom pendaftaran!");
      return;
    }

    if (!db) {
      alert("Koneksi Database belum siap. Silakan refresh halaman!");
      return;
    }

    try {
      const q = query(collection(db, "users"), where("no_induk", "==", noInduk));
      const querySnapshot = await getDocs(q);

      if (!querySnapshot.empty) {
        alert("Nomor Induk ini sudah terdaftar! Silakan kembali ke form Login.");
        return;
      }

      await addDoc(collection(db, "users"), {
        no_induk: noInduk,
        nama: nama,
        password: password,
        role: "anggota"
      });

      localStorage.setItem("userLoggedIn", noInduk);
      localStorage.setItem("userRole", "anggota");
      localStorage.setItem("userName", nama);

      alert(`Akun berhasil dibuat! Selamat datang, ${nama}`);
      window.location.href = "index.html";
    } catch (err) {
      console.error(err);
      alert("Gagal mendaftar: " + err.message);
    }
  });

  // 3. LOGIN ANGGOTA
  document.getElementById('btn-login-anggota').addEventListener('click', async () => {
    const noInduk = document.getElementById("a-noinduk").value.trim();
    const password = document.getElementById("a-password").value.trim();

    if (!noInduk || !password) {
      alert("Harap isi Nomor Induk dan Password!");
      return;
    }

    if (!db) {
      alert("Koneksi Database belum siap. Silakan refresh halaman!");
      return;
    }

    try {
      const q = query(collection(db, "users"), where("no_induk", "==", noInduk), where("password", "==", password));
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        alert("Nomor Induk atau Password salah! Jika belum punya akun, klik 'Daftar di sini'.");
      } else {
        let userData;
        querySnapshot.forEach(doc => userData = doc.data());

        localStorage.setItem("userLoggedIn", userData.no_induk);
        localStorage.setItem("userRole", "anggota");
        localStorage.setItem("userName", userData.nama);

        alert(`Selamat datang kembali, ${userData.nama}!`);
        window.location.href = "index.html";
      }
    } catch (err) {
      console.error(err);
      alert("Gagal login: " + err.message);
    }
  });
</script>
</body>
</html>
